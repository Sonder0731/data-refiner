read_json:
  op_name: "regular_path_reader"
  input_path: "./tests/pipeline/test_data/json/filter_by_line_regex.json"
  format: "json"
  output_df: "input_df"
t2s:
  op_name: "filter_line_by_regex_mapper"
  input_df: "input_df"
  output_df: "output_df"
  regex: "\\d+"
  field: "content"
  output_field: "content"
  select:
    - content
  show: true