# pytest.ini
[pytest]
# 1. 指定哪些文件会被识别为测试
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
import-mode = importlib
pythonpath = .

# 2. 自定义标记（避免 UnknownMarkWarning）
markers =
    slow: mark test as slow
    integration: mark test as integration
    unit: mark test as unit

# 3. 添加运行时的默认参数
addopts = -sv -ra --disable-warnings

# 4. 指定测试路径（pytest 默认会从当前目录找 tests/）
testpaths = tests

# 5. 配置日志
log_cli = true
log_cli_level = INFO
